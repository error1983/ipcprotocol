name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: node test_v11.js
      - run: node tests/v112/test_auth_caps.js
      - run: node tests/v112/test_multiclient_rotation.js

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python python/test_loopback.py
      - run: python tests/v112/test_supervisor.py

  dotnet:
    name: C# (JIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build with AOT analyzers (IL2026/IL3050 as errors)
        run: dotnet build csharp/IpcProtocol/IpcProtocol.csproj -c Release -p:WarningsAsErrors=IL2026%3BIL3050
      - run: dotnet run -c Release --project csharp/IpcProtocol.Tests
      - run: dotnet run -c Release --project csharp/IpcProtocol.AotSmoke
      - run: dotnet run -c Release --project tests/v112/csharp/SupervisorTest.csproj

  dotnet-aot-windows:
    name: C# (Native AOT, win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Native AOT
        run: dotnet publish csharp/IpcProtocol.AotSmoke/IpcProtocol.AotSmoke.csproj -c Release -r win-x64 -p:PublishAot=true -o out/aot-win
      - name: Run AOT smoke
        run: .\out\aot-win\IpcProtocol.AotSmoke.exe

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test -count=1 ./...
        working-directory: go

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: rust

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac -encoding UTF-8 -d java/out java/src/ipc/*.java
      - run: java -cp java/out ipc.LoopbackTest
      - run: java -cp java/out ipc.SupervisorTest

  c-cpp:
    name: C / C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run C++
        run: |
          mkdir -p cpp/out
          g++ -std=c++17 -O2 -Wall -Icpp/include cpp/tests/loopback_test.cpp -o cpp/out/loopback_test -lpthread
          ./cpp/out/loopback_test
      - name: Build & run C
        run: |
          mkdir -p c/out
          gcc -std=c11 -O2 -Wall -Ic c/loopback_test.c c/json.c c/message_stream.c c/rpc.c c/tcp.c -o c/out/loopback_test -lpthread
          ./c/out/loopback_test
